name: Build uasak_dump (Windows)
description: >
  Builds the o6 uasak_dump tool (LogIt v0.1.3 + open62541-compat fork + uasak)
  on windows-2025 into ./uasak/build/uasak_dump.exe. uasak_dump is an OPC UA
  *client* and is backend-agnostic, so the same tool drives the oracle for both
  the o6 and uasdk servers. Requires the setup-quasar-windows action to have run
  first (MSVC + the w2025 dep tree on the environment). The built exe is cached
  keyed on every source ref plus the toolchain, so case cells normally restore
  it in seconds instead of rebuilding.

runs:
  using: composite
  steps:
    - name: Derive the uasak_dump cache key (source refs + toolchain)
      id: key
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        # uasak_dump.exe is a pure function of the three pinned source refs (they
        # must match the clone commands in the build step below), the w2025 dep
        # tree it links against (IMAGES_W2025_REF from setup-quasar-windows), and
        # the MSVC toolchain. Branch refs are resolved to remote SHAs so a moved
        # branch can never serve a stale binary. Bump the trailing -v2 to
        # invalidate manually.
        function Resolve-RemoteSha($repo, $ref) {
          $out = @(git ls-remote $repo $ref)
          if ($LASTEXITCODE -ne 0 -or -not $out) { throw "git ls-remote $repo $ref failed" }
          ($out[0] -split '\s+')[0].Substring(0, 12)
        }
        $uasak  = Resolve-RemoteSha 'https://github.com/quasar-team/UaSwissArmyKnife.git' 'refs/heads/windows-msvc'
        $compat = Resolve-RemoteSha 'https://github.com/quasar-team/open62541-compat.git' 'refs/tags/v1.5.8'
        $logit  = Resolve-RemoteSha 'https://github.com/quasar-team/LogIt.git' 'refs/tags/v0.1.3'
        $vc = $env:VCToolsVersion; if (-not $vc) { $vc = 'unknown' }
        $vc = (($vc -split '\.')[0..1] -join '.')
        $deps = $env:IMAGES_W2025_REF; if (-not $deps) { throw "IMAGES_W2025_REF not set - setup-quasar-windows must run first" }
        $key = "uasak-dump-win-$uasak-$compat-$logit-vc$vc-deps$deps-v2"
        Write-Host "uasak_dump cache key: $key"
        "key=$key" >> $env:GITHUB_OUTPUT

    - name: Restore uasak_dump from cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: uasak/build/uasak_dump.exe
        key: ${{ steps.key.outputs.key }}

    - name: Build uasak_dump (+ LogIt + compat)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        # PowerShell's ErrorActionPreference does NOT stop on a native-exe nonzero
        # exit, so a failed cmake silently cascades. Guard every cmake call so the
        # first real failure stops here and is attributable.
        function chk($what) { if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" } }
        # LogIt (2.8) and uasak (3.0) declare cmake_minimum_required < 3.5, which the
        # runner's CMake 4.x removed support for -- the documented escape hatch is
        # CMAKE_POLICY_VERSION_MINIMUM=3.5 (harmless for compat, which requires 3.16).
        $policy = '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
        # LogIt/compat/uasak resolve Boost via find_package(Boost ...), independent
        # of quasar's path-based BoostSetup. The w2025 Boost (1.91) installs CMake
        # config files, and CMake 4 removed the FindBoost module -- so drive CONFIG
        # mode via Boost_DIR (the old Boost_COMPILER/FindBoost hints are dead).
        # Sanity-probe on boost_thread: Boost >= 1.89 ships NO compiled system lib
        # (header-only, stub removed), so system is the wrong canary.
        Remove-Item Env:CMAKE_TOOLCHAIN_FILE -ErrorAction SilentlyContinue
        $sample = Get-ChildItem "$env:BOOST_PATH_LIBS" -Filter 'libboost_thread-*-mt-x64-*.lib' | Select-Object -First 1
        if (-not $sample) { throw "no boost thread lib under $env:BOOST_PATH_LIBS" }
        $bcfg = Get-ChildItem "$env:BOOST_PATH_LIBS\cmake" -Directory -Filter 'Boost-*' -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $bcfg) { throw "no BoostConfig dir under $env:BOOST_PATH_LIBS\cmake" }
        Write-Host "boost lib sample: $($sample.Name); Boost_DIR: $($bcfg.FullName)"
        $boost = @(
          "-DBoost_DIR=$($bcfg.FullName)",
          "-DBoost_USE_STATIC_LIBS=ON"
        )
        git clone --depth=1 -b windows-msvc https://github.com/quasar-team/UaSwissArmyKnife.git uasak
        cd uasak
        New-Item -ItemType Directory -Force build\deploy | Out-Null
        # 1) LogIt v0.1.3 -> static lib + headers into build/deploy/LogIt
        git clone --depth=1 -b v0.1.3 https://github.com/quasar-team/LogIt.git build\work\LogIt
        cmake -S build\work\LogIt -B build\work\LogIt\b -G Ninja $policy -DCMAKE_BUILD_TYPE=Release -DLOGIT_BUILD_STAND_ALONE=ON -DLOGIT_BUILD_STATIC_LIB=ON @boost -DCMAKE_INSTALL_PREFIX="$PWD\build\deploy\LogIt"; chk "LogIt configure"
        cmake --build build\work\LogIt\b; chk "LogIt build"
        cmake --install build\work\LogIt\b; chk "LogIt install"
        # 2) open62541-compat (fork) -> static lib + headers into build/deploy/open62541-compat
        # compat >= v1.5.8 resolves Boost via find_package(Boost CONFIG); use compat's
        # own boost_custom_win.cmake (new in v1.5.8): it globs tagged libs from the
        # flat $env:BOOST_PATH_LIBS dir (the w2025 Boost lib dir) bypassing discovery.
        # It requires an explicit CMAKE_BUILD_TYPE (Release picks the -mt- libs and
        # the /MD runtime; empty drifts to debug autolink names). Absolute config
        # path: compat's include() resolves relative names against the cmake cwd
        # (the uasak dir), not its source dir.
        git clone -b v1.5.8 https://github.com/quasar-team/open62541-compat.git build\work\compat
        cmake -S build\work\compat -B build\work\compat\b -G Ninja $policy -DCMAKE_BUILD_TYPE=Release -DSTANDALONE_BUILD=ON -DLOGIT_BUILD_OPTION=LOGIT_AS_EXT_STATIC -DLOGIT_INCLUDE_DIR="$PWD\build\deploy\LogIt\include" -DLOGIT_EXT_LIB_DIR="$PWD\build\deploy\LogIt\lib" -DOPEN62541-COMPAT_BUILD_CONFIG_FILE="$($PWD.Path -replace '\\','/')/build/work/compat/boost_custom_win.cmake" -DCMAKE_INSTALL_PREFIX="$PWD\build\deploy\open62541-compat" -DSKIP_TESTS=ON; chk "compat configure"
        cmake --build build\work\compat\b; chk "compat build"
        cmake --install build\work\compat\b; chk "compat install"
        # 3) uasak_dump itself. xerces-c is linked by bare name -> alias the static
        #    xerces-c_3.lib and put the w2025 lib dirs on LIB; the xsd-generated
        #    UANodeSet.cxx pulls <xsd/cxx/...> + <xercesc/...> headers that uasak's
        #    include_directories doesn't cover -> add them to cl's INCLUDE. The
        #    w2025 xerces is static -> XERCES_STATIC_LIBRARY, or its headers declare
        #    dllimport symbols and the link fails.
        if (-not (Test-Path "$env:XERCESC_PATH_LIBS\xerces-c.lib")) { Copy-Item "$env:XERCESC_PATH_LIBS\xerces-c_3.lib" "$env:XERCESC_PATH_LIBS\xerces-c.lib" }
        $env:LIB = "$env:LIB;$env:XERCESC_PATH_LIBS"
        $env:INCLUDE = "$env:INCLUDE;$env:CODE_SYNTHESYS_XSD_PATH_HEADERS;$env:XERCESC_PATH_HEADERS"
        $env:CL = "$env:CL /DXERCES_STATIC_LIBRARY"
        cmake -S . -B build -G Ninja $policy -DCMAKE_BUILD_TYPE=Release @boost -DXSD_CXX_COMMAND=xsdcxx -DCMAKE_EXE_LINKER_FLAGS="/LIBPATH:$env:XERCESC_PATH_LIBS /LIBPATH:$env:BOOST_PATH_LIBS"; chk "uasak configure"
        cmake --build build; chk "uasak build"
        Get-ChildItem -Recurse -Filter 'uasak_dump*' build | Select-Object FullName

    - name: Save uasak_dump to cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: uasak/build/uasak_dump.exe
        key: ${{ steps.key.outputs.key }}

    - name: Verify uasak_dump is present (restored or freshly built)
      shell: pwsh
      run: |
        if (-not (Test-Path 'uasak\build\uasak_dump.exe')) { throw 'uasak_dump.exe missing after cache restore/build' }
        Get-Item 'uasak\build\uasak_dump.exe' | Select-Object FullName, Length, LastWriteTime
