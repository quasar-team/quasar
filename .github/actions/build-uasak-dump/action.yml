name: Build uasak_dump (Windows)
description: >
  Builds ./uasak/build/uasak_dump.exe on windows-2025 from LogIt + open62541-compat
  + uasak, each pinned to an exact commit, and caches it keyed on those pins, this
  file's build recipe and the toolchain. uasak_dump is a backend-agnostic OPC UA
  client, so one build serves both the o6 and uasdk lanes. Requires the
  setup-quasar-windows action to have run first.

runs:
  using: composite
  steps:
    - name: Derive the uasak_dump cache key (source pins + build recipe + toolchain)
      id: key
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $pins = @(
          @{ id='uasak';  repo='https://github.com/quasar-team/UaSwissArmyKnife.git'; tag='';       sha='83cfc083a97337dcc4ae2ba4c2925fdaa12901ef' },
          @{ id='compat'; repo='https://github.com/quasar-team/open62541-compat.git'; tag='v1.5.12'; sha='ec48098d145436f6c39d5d100179bf63f2d05408' },
          @{ id='logit';  repo='https://github.com/quasar-team/LogIt.git';            tag='v0.1.3'; sha='6bf35197ef80f175c08d7888fcfa6563916d01ba' }
        )
        function Write-AdvisoryTagDriftAnnotation {
          param($id, $repo, $tag, $pinnedSha)
          try {
            $out = @(git ls-remote $repo "refs/tags/$($tag)" "refs/tags/$($tag)^{}")
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "cannot reach $($repo) to check $($tag) - the pin is still enforced after checkout. This probe is advisory and never fatal, which is why the step pins `$PSNativeCommandUseErrorActionPreference to `$false and inspects `$LASTEXITCODE by hand instead of letting a native failure terminate."
              return
            }
            if (-not $out) {
              Write-Host "::error::$($id): tag $($tag) no longer exists in $($repo) - warm cells keep serving the pinned binary, but every COLD cell will fail at clone. Re-point or re-pin in .github/actions/build-uasak-dump/action.yml."
              return
            }
            $peeledLines = @($out | Where-Object { $_ -match '\^\{\}$' })
            $refLine = if ($peeledLines.Count) { $peeledLines[0] } else { $out[0] }
            $actual = ($refLine -split '\s+')[0]
            if ($actual -ne $pinnedSha) {
              Write-Host "::error::$($id): tag $($tag) now resolves to $actual but this action pins $($pinnedSha) - either the upstream tag moved (the oracle would have changed with no commit in this repo) or the pin holds the tag object instead of the peeled commit from ``git ls-remote <repo> 'refs/tags/$($tag)^{}'``. Warm cells are unaffected; every cold cell fails at Assert-Pinned. Re-point or re-pin in .github/actions/build-uasak-dump/action.yml."
            }
          } catch {
            Write-Host "::warning::the tag-drift probe for $($id) failed internally and is deliberately never fatal - it runs before the cache restore and this step has no if:, so throwing here would red the whole Windows matrix on an upstream event: $_"
          }
        }
        foreach ($p in $pins) {
          if ($p.sha -cnotmatch '^[0-9a-f]{40}$') { throw "$($p.id): pin must be a full lowercase 40-hex commit, got '$($p.sha)'" }
          "$($p.id)_sha=$($p.sha)"   >> $env:GITHUB_OUTPUT
          "$($p.id)_repo=$($p.repo)" >> $env:GITHUB_OUTPUT
          if (-not $p.tag) { continue }
          "$($p.id)_tag=$($p.tag)" >> $env:GITHUB_OUTPUT
          Write-AdvisoryTagDriftAnnotation -id $p.id -repo $p.repo -tag $p.tag -pinnedSha $p.sha
        }
        $short = $pins | ForEach-Object { $_.sha.Substring(0, 12) }
        $ap = $env:GITHUB_ACTION_PATH
        if (-not $ap) { throw "GITHUB_ACTION_PATH not set - cannot hash the build recipe into the cache key" }
        $recipeHash = (Get-FileHash "$ap/action.yml" -Algorithm SHA256).Hash.Substring(0, 12).ToLower()
        $vc = $env:VCToolsVersion; if (-not $vc) { $vc = 'unknown' }
        $deps = $env:IMAGES_W2025_REF; if (-not $deps) { throw "IMAGES_W2025_REF not set - setup-quasar-windows must run first" }
        $key = "uasak-dump-win-$($short -join '-')-vc$vc-deps$deps-r$recipeHash"
        Write-Host "uasak_dump cache key: $key"
        Write-Host "cache key inputs: the pinned uasak/compat/LogIt commits, full MSVC VCToolsVersion $vc, w2025 dep tree $deps, and the SHA-256 of this action.yml - hashing the recipe is what stops an edited build from restoring the binary a previous recipe produced, which would otherwise let a PR go green on master's exe and then flip the oracle for everyone at a later eviction; the price is one cold uasak_dump build per Windows cell whenever this file changes"
        "key=$key" >> $env:GITHUB_OUTPUT

    - name: Restore uasak_dump from cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: uasak/build/uasak_dump.exe
        key: ${{ steps.key.outputs.key }}

    - name: Build uasak_dump (+ LogIt + compat)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        UASAK_REPO:  ${{ steps.key.outputs.uasak_repo }}
        UASAK_SHA:   ${{ steps.key.outputs.uasak_sha }}
        COMPAT_REPO: ${{ steps.key.outputs.compat_repo }}
        COMPAT_TAG:  ${{ steps.key.outputs.compat_tag }}
        COMPAT_SHA:  ${{ steps.key.outputs.compat_sha }}
        LOGIT_REPO:  ${{ steps.key.outputs.logit_repo }}
        LOGIT_TAG:   ${{ steps.key.outputs.logit_tag }}
        LOGIT_SHA:   ${{ steps.key.outputs.logit_sha }}
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        function chk($what) { if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" } }
        foreach ($v in 'UASAK_REPO','UASAK_SHA','COMPAT_REPO','COMPAT_TAG','COMPAT_SHA','LOGIT_REPO','LOGIT_TAG','LOGIT_SHA') {
          if (-not [Environment]::GetEnvironmentVariable($v)) { throw "$v is empty - the pins table in the key step did not emit it (compat/LogIt are cloned by tag; SHA-pinning them means switching to the fetch-by-commit form used for uasak)" }
        }
        function Assert-Pinned($dir, $sha) {
          $head = (git -C $dir rev-parse HEAD); chk "rev-parse in $dir"
          if ($head -ne $sha) { throw "$dir is at $head but the cache key was derived from $sha - refusing to cache a binary under a key that does not describe it" }
        }
        $cmake4LegacyPolicyFlag = '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
        Remove-Item Env:CMAKE_TOOLCHAIN_FILE -ErrorAction SilentlyContinue
        $sample = Get-ChildItem "$env:BOOST_PATH_LIBS" -Filter 'libboost_thread-*-mt-x64-*.lib' | Select-Object -First 1
        if (-not $sample) { throw "no libboost_thread-*-mt-x64-*.lib under $env:BOOST_PATH_LIBS - LogIt/compat/uasak resolve Boost through find_package, independently of quasar's path-based BoostSetup, and thread is the probe because Boost >= 1.89 ships no compiled system lib" }
        $bcfg = Get-ChildItem "$env:BOOST_PATH_LIBS\cmake" -Directory -Filter 'Boost-*' -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $bcfg) { throw "no BoostConfig dir under $env:BOOST_PATH_LIBS\cmake - CMake 4 removed the FindBoost module, so Boost must resolve in CONFIG mode via Boost_DIR and the old Boost_COMPILER/FindBoost hints no longer apply" }
        Write-Host "boost lib sample: $($sample.Name); Boost_DIR: $($bcfg.FullName)"
        $boost = @(
          "-DBoost_DIR=$($bcfg.FullName)",
          "-DBoost_USE_STATIC_LIBS=ON"
        )
        New-Item -ItemType Directory -Force uasak | Out-Null
        cd uasak
        git init -q .; chk "uasak git init"
        git remote add origin $env:UASAK_REPO; chk "uasak remote add"
        git fetch --no-tags --depth=1 origin $env:UASAK_SHA; chk "uasak fetch of $env:UASAK_SHA (git clone -b takes a branch or a tag and never a bare commit, hence this init+fetch form; if the commit is unreachable, the ref carrying it was rewritten or deleted upstream - re-pin from: git ls-remote $env:UASAK_REPO refs/heads/windows-msvc refs/tags/v0.8.0 refs/heads/master)"
        git checkout -q --detach FETCH_HEAD; chk "uasak checkout"
        Assert-Pinned '.' $env:UASAK_SHA
        New-Item -ItemType Directory -Force build\deploy | Out-Null
        git clone --depth=1 -b $env:LOGIT_TAG $env:LOGIT_REPO build\work\LogIt; chk "LogIt clone of $env:LOGIT_TAG (if the tag is gone, re-point or re-pin in this file)"
        Assert-Pinned 'build\work\LogIt' $env:LOGIT_SHA
        cmake -S build\work\LogIt -B build\work\LogIt\b -G Ninja $cmake4LegacyPolicyFlag -DCMAKE_BUILD_TYPE=Release -DLOGIT_BUILD_STAND_ALONE=ON -DLOGIT_BUILD_STATIC_LIB=ON @boost -DCMAKE_INSTALL_PREFIX="$PWD\build\deploy\LogIt"; chk "LogIt configure (LogIt declares cmake_minimum_required 2.8, which CMake 4 refuses without $cmake4LegacyPolicyFlag)"
        cmake --build build\work\LogIt\b; chk "LogIt build"
        cmake --install build\work\LogIt\b; chk "LogIt install"
        git clone -b $env:COMPAT_TAG $env:COMPAT_REPO build\work\compat; chk "compat clone of $env:COMPAT_TAG (if the tag is gone, re-point or re-pin in this file)"
        Assert-Pinned 'build\work\compat' $env:COMPAT_SHA
        if (-not (Test-Path 'build\work\compat\boost_custom_win.cmake')) { throw "compat $env:COMPAT_TAG does not ship boost_custom_win.cmake - this build depends on it to glob tagged Boost libs straight from the flat $env:BOOST_PATH_LIBS instead of going through find_package discovery" }
        $compatBoostConfigAbsolutePath = "$($PWD.Path -replace '\\','/')/build/work/compat/boost_custom_win.cmake"
        cmake -S build\work\compat -B build\work\compat\b -G Ninja $cmake4LegacyPolicyFlag -DCMAKE_BUILD_TYPE=Release -DSTANDALONE_BUILD=ON -DLOGIT_BUILD_OPTION=LOGIT_AS_EXT_STATIC -DLOGIT_INCLUDE_DIR="$PWD\build\deploy\LogIt\include" -DLOGIT_EXT_LIB_DIR="$PWD\build\deploy\LogIt\lib" -DOPEN62541-COMPAT_BUILD_CONFIG_FILE="$compatBoostConfigAbsolutePath" -DCMAKE_INSTALL_PREFIX="$PWD\build\deploy\open62541-compat" -DSKIP_TESTS=ON; chk "compat configure (the build config file is passed absolute because compat's include() resolves relative names against the cmake working directory, not its own source dir)"
        cmake --build build\work\compat\b; chk "compat build (unresolved libboost_*-gd-* autolink names here mean CMAKE_BUILD_TYPE did not reach compat as Release, which is what selects the -mt- libs and the /MD runtime)"
        cmake --install build\work\compat\b; chk "compat install"
        if (-not (Test-Path "$env:XERCESC_PATH_LIBS\xerces-c.lib")) {
          if (-not (Test-Path "$env:XERCESC_PATH_LIBS\xerces-c_3.lib")) { throw "no xerces-c.lib and no xerces-c_3.lib under $env:XERCESC_PATH_LIBS - uasak links xerces-c by bare name, so the w2025 static lib has to be aliased to xerces-c.lib" }
          Copy-Item "$env:XERCESC_PATH_LIBS\xerces-c_3.lib" "$env:XERCESC_PATH_LIBS\xerces-c.lib"
        }
        $env:LIB = "$env:LIB;$env:XERCESC_PATH_LIBS"
        $env:INCLUDE = "$env:INCLUDE;$env:CODE_SYNTHESYS_XSD_PATH_HEADERS;$env:XERCESC_PATH_HEADERS"
        $xercesStaticLinkDefine = '/DXERCES_STATIC_LIBRARY'
        $env:CL = "$env:CL $xercesStaticLinkDefine"
        cmake -S . -B build -G Ninja $cmake4LegacyPolicyFlag -DCMAKE_BUILD_TYPE=Release @boost -DXSD_CXX_COMMAND=xsdcxx -DCMAKE_EXE_LINKER_FLAGS="/LIBPATH:$env:XERCESC_PATH_LIBS /LIBPATH:$env:BOOST_PATH_LIBS"; chk "uasak configure (a CMake 'list ... index 2 out of range' here means git describe --tags saw a tag - the fetch above is --no-tags precisely so describe stays empty and uasak's CMakeLists takes its 0.0.0 fallback)"
        cmake --build build; chk "uasak build (unresolved __imp_ xercesc symbols here mean $xercesStaticLinkDefine did not reach cl - the w2025 xerces is static and its headers declare dllimport without that define; the xsd-generated UANodeSet.cxx also needs the xsd and xercesc header dirs on INCLUDE, which is why they are appended above)"
        Get-ChildItem -Recurse -Filter 'uasak_dump*' build | Select-Object FullName

    - name: Save uasak_dump to cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: uasak/build/uasak_dump.exe
        key: ${{ steps.key.outputs.key }}

    - name: Verify uasak_dump is present (restored or freshly built)
      shell: pwsh
      run: |
        if (-not (Test-Path 'uasak\build\uasak_dump.exe')) { throw 'uasak_dump.exe missing after cache restore/build' }
        Get-Item 'uasak\build\uasak_dump.exe' | Select-Object FullName, Length, LastWriteTime
