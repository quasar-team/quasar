name: Setup quasar Windows build environment
description: >
  Token-free, GitHub-hosted windows-2025 build environment for quasar,
  provisioned by running the BE-ICS w2025 image scripts (quasar-team/images)
  at a pinned ref -- so CI builds against the same dependency set BE-ICS
  ships to production: source-built static /MD Boost, OpenSSL, LibXml2,
  Xerces-C, and CodeSynthesis XSD installed as xsdcxx.exe. The built dep tree
  is cached keyed on the images ref; cold builds take ~45-60 min, cached
  restores seconds.

  A real Windows container image isn't used here: a container can't reuse the
  runner's pre-installed Visual Studio, so it would have to bake MSVC (~20 GB,
  slow per-job pulls). Running the image scripts directly, with the result
  cached, is the "one move clean" equivalent -- and keeps our environment
  drift-free against BE-ICS's by construction.

runs:
  using: composite
  steps:
    - name: Activate MSVC dev environment (x64) -- provides cl + ninja, no VS-instance detection
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install Python codegen deps (+ astyle for generated-code formatting)
      shell: pwsh
      run: |
        python -m pip install jinja2 lxml colorama pygit2
        choco install astyle -y --no-progress
    # The pin is the w2025-jcop-sync branch of quasar-team/images -- a verbatim
    # snapshot of jcop-opc-ua/common/images (the scripts BE-ICS builds their WS25
    # CI images and dev envs from). Bump the ref to pick up their changes.
    - name: Pin the BE-ICS w2025 image scripts
      id: images
      shell: pwsh
      run: |
        $ref='44e4fd7730025a9be1b8d4209776f5399f7ac995'
        git clone -q https://github.com/quasar-team/images.git C:\deps\images
        git -C C:\deps\images checkout -q $ref
        "ref=$ref" >> $env:GITHUB_OUTPUT
        "IMAGES_W2025_REF=$($ref.Substring(0,12))" >> $env:GITHUB_ENV
        "BOOST_HOME=C:\qdeps\boost" >> $env:GITHUB_ENV
        "LIBSSL_HOME=C:\qdeps\openssl" >> $env:GITHUB_ENV
        "LIBXML2_HOME=C:\qdeps\libxml2" >> $env:GITHUB_ENV
        "XERCES_C_HOME=C:\qdeps\xerces-c" >> $env:GITHUB_ENV
        "XSD_HOME=C:\qdeps\xsd" >> $env:GITHUB_ENV
    # Split restore/save so the dep tree is cached right after a successful dep
    # build (before the quasar build step that may still fail) -- the combined
    # cache action skips saving on a failed job.
    - name: Restore w2025 deps cache
      id: depscache
      uses: actions/cache/restore@v4
      with:
        path: C:\qdeps
        key: w2025-deps-${{ steps.images.outputs.ref }}-v1
    - name: Build deps via the w2025 scripts (cache miss only)
      if: steps.depscache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $s='C:\deps\images\w2025\scripts'
        . "$s\Common.ps1"
        Initialize-IssueFile
        . "$s\Install-SpecialDeps.ps1"
        . "$s\Build-OpenSSL.ps1"
        . "$s\Build-LibXml2.ps1"
        . "$s\Build-Boost.ps1"
        . "$s\Build-Xerces-C.ps1"
        . "$s\Install-Xsd.ps1"
        . "$s\Install-LibXsd.ps1"
    - name: Save w2025 deps cache
      if: steps.depscache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\qdeps
        key: w2025-deps-${{ steps.images.outputs.ref }}-v1
    # Map the *_HOME layout onto the env names the quasar win configurations and
    # build-uasak-dump consume. Everything is static: no runtime DLL PATH needed.
    - name: Expose dep paths
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $bi = Get-ChildItem "$env:BOOST_HOME\include" -Directory -Filter 'boost-*' -ErrorAction SilentlyContinue | Select-Object -First 1
        $boostInc = if ($bi) { $bi.FullName } else { "$env:BOOST_HOME\include" }
        if (-not (Test-Path "$boostInc\boost")) { throw "boost headers not found under $env:BOOST_HOME\include" }
        $sslLibs = if (Test-Path "$env:LIBSSL_HOME\lib64") { "$env:LIBSSL_HOME\lib64" } else { "$env:LIBSSL_HOME\lib" }
        "BOOST_PATH_HEADERS=$boostInc" >> $env:GITHUB_ENV
        "BOOST_PATH_LIBS=$env:BOOST_HOME\lib" >> $env:GITHUB_ENV
        "OPENSSL_PATH_HEADERS=$env:LIBSSL_HOME\include" >> $env:GITHUB_ENV
        "OPENSSL_PATH_LIBS=$sslLibs" >> $env:GITHUB_ENV
        "XERCESC_PATH_HEADERS=$env:XERCES_C_HOME\include" >> $env:GITHUB_ENV
        "XERCESC_PATH_LIBS=$env:XERCES_C_HOME\lib" >> $env:GITHUB_ENV
        "LIBXML2_PATH_LIBS=$env:LIBXML2_HOME\lib" >> $env:GITHUB_ENV
        "CODE_SYNTHESYS_XSD_PATH_HEADERS=$env:XSD_HOME\include" >> $env:GITHUB_ENV
        "$env:XSD_HOME" >> $env:GITHUB_PATH
        Write-Host "boost=$boostInc ssl=$sslLibs xsd=$env:XSD_HOME"
